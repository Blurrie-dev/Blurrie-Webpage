name: Sync Steam data

# Refreshes data/steam.json from the Steam Web API so the Games app can show
# what's actually being played. Needs two repository secrets:
#   STEAM_API_KEY  — from https://steamcommunity.com/dev/apikey
#   STEAM_ID       — the 17-digit SteamID64 (76561198965734883)

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from Steam
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
        run: node scripts/steam-sync.mjs
      - name: Commit if changed
        run: |
          git config user.name "steam-sync[bot]"
          git config user.email "steam-sync@users.noreply.github.com"
          git add data/steam.json
          git diff --cached --quiet || git commit -m "chore: refresh Steam data"
          git push
